[project]
name = "tb"
version = "0.1.0"
description = "Transformación del Trial Balance de SAP a la TB de Cotown"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 120
target-version = "py312"
# The scripts and the services follow the style of the ETL (back/etl), not this one
extend-exclude = ["tb.py", "sap.py", "library/services"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "Q", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"
